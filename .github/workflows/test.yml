name: test

on:
  push:
  pull_request:

jobs:
  clipnest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clipnest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node --check popup.js
      - run: node --check content.js
      - run: node --check background.js
